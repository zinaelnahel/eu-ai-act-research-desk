name: EU AI Act evaluation

on:
  push:
    paths:
      - 'public/eu-ai-act/**'
      - 'eu-ai-act/**'
      - 'api/**'
      - 'vercel.json'
      - '.github/workflows/eu-ai-act.yml'
  pull_request:
    paths:
      - 'public/eu-ai-act/**'
      - 'eu-ai-act/**'
      - 'api/**'
      - 'vercel.json'
      - '.github/workflows/eu-ai-act.yml'
  workflow_dispatch:
    inputs:
      hosted_eval:
        description: Run the paid-model smoke benchmark against production
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  hosted-evaluation:
    if: github.event_name == 'workflow_dispatch' && inputs.hosted_eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node eu-ai-act/rag-eval.mjs --hosted rag-hosted-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rag-hosted-results
          path: rag-hosted-results.json

  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify corpus, learning progress and RAG contracts
        run: node --test --test-reporter=spec --test-reporter=junit --test-reporter-destination=stdout --test-reporter-destination=node-results.xml eu-ai-act/*.test.mjs
      - name: Check the authored challenge set
        run: node eu-ai-act/challenge-eval.mjs challenge-results.json --gate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest, Playwright and Chromium
        run: |
          python -m pip install -r eu-ai-act/requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Run pytest retrieval and browser suites
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || '9882baf19721d68d807aacc40be3da428508416b' }}
        run: |
          baseline=$(mktemp -d)
          git archive "$BASE_REF" public/eu-ai-act | tar -x -C "$baseline"
          EU_AI_ACT_VISUAL_BASELINE="$baseline/public/eu-ai-act" python -m pytest eu-ai-act -v --junitxml=pytest-results.xml
      - uses: grafana/setup-k6-action@v1
      - name: Check static delivery with k6
        run: |
          mkdir -p quality-results
          python -m http.server 8184 --bind 127.0.0.1 --directory public/eu-ai-act > quality-results/server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail --silent http://127.0.0.1:8184/index.html >/dev/null
          k6 run eu-ai-act/performance.js
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eu-ai-act-evaluation
          path: |
            public/eu-ai-act/evaluation.json
            pytest-results.xml
            node-results.xml
            challenge-results.json
      - name: Upload visual and performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eu-ai-act-quality-evidence
          path: quality-results/

  evaluation-frameworks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run LangSmith, DeepEval and Ragas offline
        run: |
          python -m pip install -r eu-ai-act/frameworks/requirements.txt
          python eu-ai-act/frameworks/evaluate_frameworks.py --output framework-results/python-frameworks.json
      - name: Run Promptfoo provision and abstention checks
        working-directory: eu-ai-act/frameworks
        env:
          PROMPTFOO_DISABLE_TELEMETRY: '1'
        run: |
          mkdir -p ../../framework-results
          npx --yes promptfoo@0.126.0 eval -c promptfooconfig.yaml --no-cache -o ../../framework-results/promptfoo.json
          node check_promptfoo.mjs ../../framework-results/promptfoo.json
      - name: Upload framework results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eu-ai-act-framework-results
          path: framework-results/
