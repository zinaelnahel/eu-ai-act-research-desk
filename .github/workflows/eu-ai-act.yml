name: EU AI Act evaluation

on:
  push:
    paths:
      - 'public/eu-ai-act/**'
      - 'eu-ai-act/**'
      - '.github/workflows/eu-ai-act.yml'
  pull_request:
    paths:
      - 'public/eu-ai-act/**'
      - 'eu-ai-act/**'
      - '.github/workflows/eu-ai-act.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify corpus, report generation and learning progress
        run: node --test eu-ai-act/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest, Playwright and Chromium
        run: |
          python -m pip install -r eu-ai-act/requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Run pytest retrieval and browser suites
        run: python -m pytest eu-ai-act -v --junitxml=pytest-results.xml
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eu-ai-act-evaluation
          path: |
            public/eu-ai-act/evaluation.json
            pytest-results.xml
