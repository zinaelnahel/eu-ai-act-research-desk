name: Ask AI starter smoke
on:
  schedule:
    - cron: '43 8 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  starters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node eu-ai-act/rag-eval.mjs --hosted starter-smoke.json --starters
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ask-ai-starter-smoke
          path: starter-smoke.json
